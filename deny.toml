# cargo-deny configuration: RustSec advisories, license compatibility, banned
# crates, and trusted sources for the full dependency graph.
# Run locally with: cargo deny --all-features check --allow unmaintained
# https://embarkstudios.github.io/cargo-deny/

# Matches the `--all-features` flag CI passes, so a local `cargo deny check`
# with no flags sees the same dependency graph as CI.
[graph]
all-features = true
no-default-features = false

[advisories]
# Each entry is an advisory whose fix we can't take yet, because a dependency
# still requires the affected version. Remove each entry once the fix lands.
# Every advisory not on this list fails CI.
# `unmaintained` findings are downgraded to non-blocking separately, via
# `--warn unmaintained` on the command line (see .github/workflows/
# dependencies.yml) - being unmaintained isn't the same as being vulnerable,
# and they stay visible in the job log rather than being silenced outright.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39.4 quadratic start-tag check; fixed in quick-xml 0.41. Two paths pull in 0.39.4: object_store 0.13.2 (datafusion, parquet and deltalake) and opendal 0.57 (iceberg-storage-opendal). Blocked until datafusion, deltalake and iceberg have releases on arrow and parquet 60 (the first to use object_store 0.14) and the workspace's own `arrow` and `parquet` requirements move to 60 with them, and iceberg-storage-opendal moves to opendal 0.58 or later" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39.4 unbounded namespace-declaration allocation; same paths and blocker as RUSTSEC-2026-0194" },
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 has no fixed release, and apache-avro, iceberg, datafusion and foyer require it; none of them calls the affected with_context constructors" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 (via zstd 0.13) has no fixed release; the affected code needs the seekable feature, which nothing enables" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 (via zstd 0.13) has no fixed release, and apache-avro, iceberg, datafusion and foyer require zstd 0.13" },
]
# RUSTSEC-2026-0258 (h2) and RUSTSEC-2026-0285 (rustls) were on this list too,
# but both had semver-compatible fixed versions available (h2 0.4.15->0.4.19,
# rustls 0.23.43->0.23.45) - `cargo update -p h2 -p rustls` on 2026-09-17
# resolved them instead of waiving them.

[licenses]
# Every license actually present in the dependency graph today. All are
# permissive except MPL-2.0 (weak copyleft: file-level, no linking
# obligation - fine for consuming unmodified crates as we do). Adding a
# stronger copyleft license here should be a deliberate, reviewed decision,
# not an incidental side effect of a dependency bump.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "MIT-0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
# Denies actual banned/untrusted crates (none listed today); duplicate
# versions stay a warning, not a hard fail - the datafusion/iceberg/delta/
# aws-sdk graph legitimately carries multiple versions of common crates
# (syn, itertools, hashbrown, etc.) and denying that outright would fail
# CI on version skew that has nothing to do with the PR being reviewed.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
