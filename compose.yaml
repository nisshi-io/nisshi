---
# Each service publishes its ports on 127.0.0.1 only, so that only this
# computer can connect. The broker does not authenticate clients by default,
# and the other services use well-known passwords or anonymous access.
services:
  grafana:
    image: grafana/grafana:11.5.1@sha256:5781759b3d27734d4d548fcbaf60b1180dbf4290e708f01f292faa6ae764c5e6
    ports:
      - 127.0.0.1:3000:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_HIDE_VERSION: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/dashboards/home.json
      GF_LIVE_ALLOWED_ORIGINS: "https://*.preview.app.github.dev"
    volumes:
      - type: bind
        source: etc/grafana/provisioning
        target: /etc/grafana/provisioning
      - type: bind
        source: etc/grafana/dashboards
        target: /etc/dashboards
      - grafana:/var/lib/grafana
    pull_policy: missing
  db:
    image: ${POSTGRES_IMAGE:-postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336}
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
    # nisshi-smoke-test/run.sh sets NISSHI_DB_PORTS, so that Docker picks the host port.
    ports:
      - ${NISSHI_DB_PORTS:-127.0.0.1:5432:5432}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      # pg_isready checks TCP, not the socket: on a new volume, the server
      # listens only on the socket while its init scripts run.
      test: /usr/bin/pg_isready --host=localhost
      interval: 5s
      timeout: 10s
      retries: 5
    pull_policy: missing
  minio:
    # MinIO no longer publishes images. pgsty/silo is a community-maintained
    # AGPLv3 fork that still does, multi-arch, with mc at /usr/bin/mc and the
    # MinIO S3 API, including conditional writes.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    volumes:
      - minio:/data
    # nisshi-smoke-test/run.sh sets these variables, so that Docker picks the host ports.
    ports:
      - ${NISSHI_MINIO_PORTS:-127.0.0.1:9000:9000}
      - ${NISSHI_MINIO_CONSOLE_PORTS:-127.0.0.1:9001:9001}
    environment:
      MINIO_PROMETHEUS_AUTH_TYPE: public
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 5s
      retries: 1
      start_period: 5s
      timeout: 5s
    pull_policy: missing
  # Each variable has a default, so that `docker compose up -d nisshi` works
  # without a .env. The defaults run the latest release on PostgreSQL. A .env
  # (see example.env) overrides any of them.
  nisshi:
    # :latest is the latest release. Set NISSHI_IMAGE to
    # ghcr.io/nisshi-io/nisshi:edge for a build of main.
    image: ${NISSHI_IMAGE:-ghcr.io/nisshi-io/nisshi:latest}
    restart: unless-stopped
    environment:
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
      RUST_LOG: ${RUST_LOG:-warn}
      # The local credentials of the minio service above. They are not AWS
      # credentials, and the s3:// storage engine needs no AWS account.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://minio:9000}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP:-true}
    volumes:
      - ./etc/schema/:/schema/
      - ./data:/data/
    command: |
      --kafka-cluster-id ${CLUSTER_ID:-nisshi}
      --kafka-listener-url tcp://0.0.0.0:9092/
      --kafka-advertised-listener-url ${ADVERTISED_LISTENER_URL:-tcp://localhost:9092}
      --storage-engine ${STORAGE_ENGINE:-postgres://postgres:postgres@db}
      --schema-registry file:///schema
    # The broker exits when its storage engine is unreachable at startup, so
    # it waits for the default engine, PostgreSQL. With another engine,
    # `docker compose up nisshi` still starts db.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:9092:9092
      - 127.0.0.1:9100:9100
  jaeger:
    # Jaeger v1 (jaegertracing/all-in-one) is end of life. Jaeger v2 ships
    # under a different image name, jaegertracing/jaeger, so a move to v2
    # needs more than a tag bump.
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
      - 127.0.0.1:5778:5778
      - 127.0.0.1:9411:9411
  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    ports:
      - 127.0.0.1:9090:9090
    command: --web.enable-otlp-receiver
    configs:
      - source: prometheus_yaml
        target: /prometheus/prometheus.yml
  lakehouse-catalog:
    image: ${LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.8.5@sha256:5b0475fff37e47fbef48f36ea2c91daf7035f04b38187b37a5f17639ecbe9cb4}
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@db:5432/postgres
      - RUST_LOG=trace,axum=trace,sqlx=trace,iceberg-catalog=trace
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/home/nonroot/iceberg-catalog", "healthcheck"]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 3s
    depends_on:
      lakehouse-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - 127.0.0.1:8181:8181
  lakehouse-migrate:
    image: ${LAKEKEEPER_IMAGE:-quay.io/lakekeeper/catalog:v0.8.5@sha256:5b0475fff37e47fbef48f36ea2c91daf7035f04b38187b37a5f17639ecbe9cb4}
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@db:5432/postgres
      - RUST_LOG=info
    restart: "no"
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
configs:
  prometheus_yaml:
    file: etc/prometheus.yaml
volumes:
  db:
    driver: local
  minio:
    driver: local
  grafana:
    driver: local
