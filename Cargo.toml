[workspace]
resolver = "3"
members = [
    "fuzz",
    "nisshi",
    "nisshi-auth",
    "nisshi-broker",
    "nisshi-cat",
    "nisshi-cli",
    "nisshi-client",
    "nisshi-generator",
    "nisshi-model",
    "nisshi-otel",
    "nisshi-perf",
    "nisshi-proxy",
    "nisshi-sans-io",
    "nisshi-schema",
    "nisshi-service",
    "nisshi-storage",
    "nisshi-topic",
]

[workspace.package]
edition = "2024"
version = "0.7.0-pre.2"
license = "Apache-2.0"
homepage = "https://nisshi.io"
repository = "https://github.com/nisshi-io/nisshi"
keywords = ["deltalake", "iceberg", "kafka", "postgres", "s3"]
authors = ["Peter Morgan <peter.morgan@tansu.io>"]
include = [
    "Cargo.toml",
    "LICENSE",
    "benches/*.rs",
    "build.rs",
    "examples/*.rs",
    "message/*.json",
    "src/**/*.avsc",
    "src/**/*.json",
    "src/**/*.proto",
    "src/**/*.rs",
    "src/**/*.sql",
    "tests",
]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
deprecated_in_future = "warn"
elided_lifetimes_in_paths = "deny"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "forbid"
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_import_braces = "warn"
unused_labels = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unused_results = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.dependencies]
anyhow = "1.0.94"
apache-avro = "0.21.0"
arrow = { version = "57" }
assert_matches = "1.5.0"
async-trait = "0.1.86"
backoff = {version = "0.4.0", features = ["tokio"]}
bytes = { version = "1", features = ["serde"] }
cached = "2.0.2"
chrono = "0.4"
clap = { version = "4.5.57", features = ["derive", "env"] }
condtype = "1.3.0"
console = "0.16.2"
convert_case = "0.11.0"
crc-fast = "1.8.0"
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
datafusion = "51"
deadpool = "0.12.2"
deadpool-postgres = "0.14.1"
delta_kernel = { version = "0.20.0", default-features = false, features = ["arrow-57"] }
deltalake = { version = "0.30", features = ["datafusion", "s3"] }
digest = "0.10.7"
dotenv = "0.15.0"
fake = "5.1.0"
flate2 = "1.1"
futures = "0.3"
futures-core = "0.3.31"
futures-util = "0.3.31"
getrandom = "0.4"
glob = "0.3.2"
governor = "0.10.4"
http-body-util = "0.1"
human-units = {version = "0.5.3", features = ["iec-units"]}
humantime = "2.2.0"
hyper = { version = "1.3", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
iceberg = "0.8"
iceberg-catalog-rest = "0.8"
iceberg-datafusion = "0.8"
indicatif = "0.18.3"
jsonschema = "0.45.0"
lazy_static = "1.4.0"
libfuzzer-sys = "0.4"
libsql = { version = "0.9.18", default-features = false, features = ["core"] }
lz4 = "1.28.1"
nanoid = "0.4.0"
nonzero_ext = "0.3.0"
num-bigint = "0.4"
object_store = { version = "0.13.1", features = ["aws", "gcp"] }
opentelemetry = "0.31.0"
opentelemetry-otlp = "0.31.0"
opentelemetry-semantic-conventions = "0.31.0"
opentelemetry-stdout = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["testing"] }
ordered-float = "5.1"
owo-colors = {version = "4.2.3", features = ["supports-colors"]}
parquet = {version = "57", features = ["async"]}
pbkdf2 = "0.12.2"
postcard = { version = "1.1.3", features = ["use-std"] }
pretty_assertions = "1"
prettyplease = "0.2.29"
proc-macro2 = "1.0.106"
proptest = "1.0.0"
protobuf = { version = "3.7.1", features = ["with-bytes"] }
protobuf-json-mapping = "3.7.1"
protobuf-parse = "3.7.1"
quote = "1.0"
rama = { version = "0.2.0", features = ["http", "tcp"] }
rand = "0.10"
regex = "1.12.3"
rhai = { version = "1.24.0", features = ["sync"] }
rhai-rand = "0.1"
rsasl = { version = "2.2.0", features = ["config_builder", "provider", "oauthbearer", "scram-sha-2"], default-features = false }
rustls = "0.23.27"
rustls-native-certs = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
slatedb = "0.10.1"
snap = "1.1.1"
syn = { version = "2.0", features = ["full"] }
nisshi = { version = "0.7.0-pre.2", path = "nisshi", default-features = false }
nisshi-auth = { version = "0.7.0-pre.2", path = "nisshi-auth", default-features = false }
nisshi-broker = { version = "0.7.0-pre.2", path = "nisshi-broker", default-features = false }
nisshi-cat = { version = "0.7.0-pre.2", path = "nisshi-cat", default-features = false }
nisshi-cli = { version = "0.7.0-pre.2", path = "nisshi-cli", default-features = false }
nisshi-client = { version = "0.7.0-pre.2", path = "nisshi-client", default-features = false }
nisshi-generator = { version = "0.7.0-pre.2", path = "nisshi-generator", default-features = false }
nisshi-model = { version = "0.7.0-pre.2", path = "nisshi-model", default-features = false }
nisshi-otel = { version = "0.7.0-pre.2", path = "nisshi-otel", default-features = false }
nisshi-perf = { version = "0.7.0-pre.2", path = "nisshi-perf", default-features = false }
nisshi-proxy = { version = "0.7.0-pre.2", path = "nisshi-proxy", default-features = false }
nisshi-sans-io = { version = "0.7.0-pre.2", path = "nisshi-sans-io", default-features = false }
nisshi-schema = { version = "0.7.0-pre.2", path = "nisshi-schema", default-features = false }
nisshi-service = { version = "0.7.0-pre.2", path = "nisshi-service", default-features = false }
nisshi-storage = { version = "0.7.0-pre.2", path = "nisshi-storage", default-features = false }
nisshi-topic = { version = "0.7.0-pre.2", path = "nisshi-topic", default-features = false }
tempfile = "3"
thiserror = "2.0"
time = { version = "0.3.47", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-postgres = { version = "0.7.13", features = ["with-serde_json-1","with-uuid-1",] }
tokio-postgres-rustls = "0.13.0"
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7", features = ["full"] }
tracing = "0.1"
tracing-core = { version = "0.1" }
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
turso = "0.7.1"
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.20.0", features = ["serde", "v4", "v5", "v7"] }
zstd = "0.13.2"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.profiling]
inherits = "release"
debug = true
