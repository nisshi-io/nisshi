experimental = ["setup-scripts"]

# A test still running after 5 minutes is killed, locally as in CI, so a test
# that hangs doesn't hold its database and catalog connections until someone
# stops the run.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# In a linked worktree, the tests that use PostgreSQL, MinIO or the lakehouse
# catalog run against the worktree's own compose project, which this script
# starts and writes to .env. In the main checkout and in CI, the script does
# nothing, and the tests use the services that `just ci` started.
[scripts.setup.worktree-services]
command = "etc/worktree-services.sh up"
# A cold start of the services on a loaded machine takes minutes, and a start
# still running after 10 minutes is killed instead of holding the run.
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.scripts]]
filter = "package(nisshi-broker) | package(nisshi-storage-sql) | package(nisshi-schema)"
setup = "worktree-services"

# Each Iceberg test runs a query engine and opens connections to the catalog
# and to MinIO, so a run starts at most 4 of them at once.
[[profile.default.overrides]]
filter = "package(nisshi-schema) & binary(berg)"
test-group = "berg"

# CI selects this profile with NEXTEST_PROFILE=ci; local runs keep the
# default profile. A test still running after 5 minutes is killed rather
# than holding the runner until the job times out. The slowest test,
# new_cg::pg::consumer_next_action_32c, takes about 62 s.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }

# CI reads this report, at target/nextest/ci/junit.xml, for the test summary
# and the test-reports artifact.
[profile.ci.junit]
path = "junit.xml"

# The durability tests are the heaviest tests, and the most sensitive to
# timing, so a run starts them one at a time. The rebalance tests run one at a
# time too, beside the other tests, because each starts up to five JVMs, and
# the `test-threads` limit counts tests, not the JVMs they start.
[test-groups]
durability = { max-threads = 1 }
consumer-group-members = { max-threads = 1 }
berg = { max-threads = 4 }

# The settings of the smoke suite (nisshi-smoke-test). Each Kafka CLI call has
# its own timeout, and `slow-timeout` stops a test that hangs anywhere else.
[profile.smoke]
fail-fast = false
# Each test starts Kafka CLI JVMs, so memory limits how many tests can run.
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 5 }

# The durability tests run clients around a broker kill or a storage outage,
# and then read back every record, so they get longer than the other tests.
[[profile.smoke.overrides]]
filter = "test(/^broker_lifecycle::durability::/)"
test-group = "durability"
slow-timeout = { period = "60s", terminate-after = 8 }

# The rebalance tests print how long consuming paused, and nextest shows a
# passing test's output only with `success-output`.
[[profile.smoke.overrides]]
filter = "test(/^groups::group_rebalance::/)"
test-group = "consumer-group-members"
success-output = "immediate"

# S3 runs only the topic lifecycle tests, which check that a broker on S3
# stores and serves topics and records. Every other engine runs every test that
# its feature compiles.
[profile.smoke-s3]
inherits = "smoke"
default-filter = "test(/^topic_admin::topic_lifecycle::/) | test(=every_test_file_is_declared)"
