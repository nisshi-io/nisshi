name: Publish image
description: Builds the multi-arch image from release's static binaries and pushes it to ghcr.io with the given tags. Used by ci.yml's publish (the `main` image) and release.yml's publish-image (the version tags).
inputs:
  tags:
    description: docker/metadata-action `tags` spec for the pushed image.
    required: true
runs:
  using: composite
  steps:
    # ci.yml's release job uploads the static musl binaries, as
    # dist/linux/<arch>/nisshi. The Dockerfile copies them into the image.
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: image-*
        merge-multiple: true
        path: dist
    - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}
        tags: ${{ inputs.tags }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        buildkitd-flags: --debug
        # This pushes the published image, so the daemon mirror is not set up
        # here: it would resolve the tag-pinned moby/buildkit builder through a
        # cache we do not control. The builder pull stays on Docker Hub, so a
        # 429 on "pulling image moby/buildkit" is that accepted trade-off.
        # BuildKit pulls the Dockerfile's base image itself, so it gets the
        # mirror through this config; that image is pinned by digest, so the
        # pull is verified either way.
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
    # A composite action can't read `secrets`; github.token is the same
    # GITHUB_TOKEN, with the calling job's `packages: write`.
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
