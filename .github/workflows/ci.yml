name: ci
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
jobs:
  gated:
    if: ${{ github.event_name == 'push' || contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "gate passed for author_association=${{ github.event.pull_request.author_association }}"
  ungated:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          echo "author_association=${{ github.event.pull_request.author_association }}"
          echo "gate=${{ github.event_name == 'push' || contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association) }}"
