---
name: ci

# `cache-save-if: github.event_name == 'push'` on a job's toolchain setup
# means every PR restores the shared cache but only a push to main refreshes
# it. This isn't a poisoning fix (GitHub already scopes a PR run's cache
# writes to that PR's own ref) - it's hygiene, keeping the repo's cache
# budget from being consumed by one entry per open PR instead of one per
# branch. Applies to check, fmt, clippy, cargo-publish-dry-run,
# third-party-license and release below (release also skips the cache
# entirely on tags).
permissions:
  contents: read
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  CLICOLOR: 1
jobs:
  test:
    needs: [check, fmt, clippy, build-storage, build-storage-lake]
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        pg:
          - postgres:16
          - postgres:17
          - postgres:18
    env:
      ADVERTISED_LISTENER_URL: tcp://localhost:9092
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ENDPOINT: http://localhost:9000
      AWS_SECRET_ACCESS_KEY: minioadmin
      CARGO_BUILD_BUILD_DIR: /mnt/build
      CLUSTER_ID: nisshi-ci
      DATA_LAKE: s3://lake
      ICEBERG_CATALOG: http://localhost:8181/catalog
      ICEBERG_WAREHOUSE: nisshi
      LAKEKEEPER_IMAGE: quay.io/lakekeeper/catalog:v0.8.5
      POSTGRES_IMAGE: ${{matrix.pg}}
      PROMETHEUS_LISTENER_URL: tcp://[::]:9100
      RUST_BACKTRACE: 1
      RUST_LOG: debug,nisshi_sans_io=warn,nisshi_model=warn
      SCHEMA_REGISTRY: file://./etc/schema
      STORAGE_ENGINE: s3://nisshi/
      NISSHI_IMAGE: ghcr.io/nisshi-io/nisshi
    steps:
      - run: sudo mkdir /mnt/build
      - run: sudo chmod a+rwxt /mnt/build
      - run: echo "PG_IMAGE_DASH=${POSTGRES_IMAGE/:/-}" >> "$GITHUB_ENV"
      - run: echo "${PG_IMAGE_DASH}"
      - run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - run: just ci
      - run: sudo apt-get update
      - run: sudo apt-get install -y libclang-dev libkrb5-dev
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          cache: false
      - run: cargo install cargo-nextest --locked
      - run: df -h
      - run: just test
      - run: df -h
        if: always()
      - run: ls -l
        if: always()
      - run: tar --create --verbose --gzip --file=logs-${{env.PG_IMAGE_DASH}}.tar.gz logs
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: logs-${{env.PG_IMAGE_DASH}}.tar.gz
          path: logs-${{env.PG_IMAGE_DASH}}.tar.gz
          if-no-files-found: error
      - run: du -sh target
      - run: docker system df
      - run: df -h
  check:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          cache-save-if: ${{ github.event_name == 'push' }}
      - run: just check
  fmt:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          cache-save-if: ${{ github.event_name == 'push' }}
      - run: just fmt
  clippy:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          cache-save-if: ${{ github.event_name == 'push' }}
      - run: just clippy
  build-storage:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        storage:
          - dynostore
          - libsql
          - postgres
          - slatedb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          cache: false
      - run: sudo apt-get update
      - run: sudo apt-get install -y libclang-dev libkrb5-dev
      - run: just build dev ${{matrix.storage}}
  build-storage-lake:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        storage:
          - dynostore
          - libsql
          - postgres
          - slatedb
        lake:
          - delta
          - iceberg
          - parquet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          cache: false
      - run: sudo apt-get update
      - run: sudo apt-get install -y libclang-dev libkrb5-dev
      - run: cargo build --features ${{matrix.storage}} --features ${{matrix.lake}}
  compat-librdkafka:
    runs-on: ${{matrix.os}}
    continue-on-error: ${{ matrix.storage.experimental }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        storage:
          - name: memory
            engine: memory://
            features: dynostore
            experimental: false
          - name: s3
            engine: s3://nisshi/
            features: dynostore
            experimental: true
          - name: postgres
            engine: postgres://postgres:postgres@localhost
            features: postgres
            experimental: true
          - name: sqlite
            engine: sqlite://nisshi.db
            features: libsql
            experimental: true
    env:
      ADVERTISED_LISTENER_URL: tcp://localhost:9092
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ENDPOINT: http://localhost:9000
      AWS_SECRET_ACCESS_KEY: minioadmin
      CLUSTER_ID: librdkafka-integration
      LAKEKEEPER_IMAGE: unused
      RESULTS_FILE: results-${{matrix.storage.name}}.csv
      RUST_BACKTRACE: 1
      RUST_LOG: warn
      STORAGE_ENGINE: ${{matrix.storage.engine}}
      NISSHI_IMAGE: hello-world
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - run: sudo apt-get update
      - run: sudo apt-get install -y libclang-dev libkrb5-dev
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - run: just compat-infra-up
      - run: just compat-librdkafka '${{matrix.storage.engine}}' '${{matrix.storage.features}}'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compat-librdkafka-results-${{matrix.storage.name}}
          path: ${{env.RESULTS_FILE}}
          if-no-files-found: warn
  compat-librdkafka-report:
    if: always()
    needs: [compat-librdkafka]
    runs-on: ubuntu-latest
    env:
      DUCKDB_CLI: /home/runner/.duckdb/cli/latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/workflows/scripts/pivot-integration-report.sql
          sparse-checkout-cone-mode: false
          path: reports
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: compat-librdkafka-results-*
          path: results
          merge-multiple: true
      - run: curl https://install.duckdb.org | sh
      - run: echo "## librdkafka compatibility report card" >> "${GITHUB_STEP_SUMMARY}"
      - run: |
          "${DUCKDB_CLI}/duckdb" -markdown -f reports/.github/workflows/scripts/pivot-integration-report.sql >> "${GITHUB_STEP_SUMMARY}"
  compat-franz-go:
    runs-on: ${{matrix.os}}
    continue-on-error: ${{ matrix.storage.experimental }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        storage:
          - name: memory
            engine: memory://
            features: dynostore
            experimental: false
          - name: s3
            engine: s3://nisshi/
            features: dynostore
            experimental: true
          - name: postgres
            engine: postgres://postgres:postgres@localhost
            features: postgres
            experimental: true
          - name: sqlite
            engine: sqlite://nisshi.db
            features: libsql
            experimental: true
    env:
      ADVERTISED_LISTENER_URL: tcp://localhost:9092
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ENDPOINT: http://localhost:9000
      AWS_SECRET_ACCESS_KEY: minioadmin
      CLUSTER_ID: librdkafka-integration
      LAKEKEEPER_IMAGE: unused
      RESULTS_FILE: results-${{matrix.storage.name}}.csv
      RUST_BACKTRACE: 1
      RUST_LOG: warn
      STORAGE_ENGINE: ${{matrix.storage.engine}}
      NISSHI_IMAGE: hello-world
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: just compat-infra-up
      - run: just compat-franz-go '${{matrix.storage.engine}}' '${{matrix.storage.features}}'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compat-franz-go-results-${{matrix.storage.name}}
          path: ${{env.RESULTS_FILE}}
          if-no-files-found: warn
  compat-franz-go-report:
    if: always()
    needs: [compat-franz-go]
    runs-on: ubuntu-latest
    env:
      DUCKDB_CLI: /home/runner/.duckdb/cli/latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/workflows/scripts/pivot-integration-report.sql
          sparse-checkout-cone-mode: false
          path: reports
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: compat-franz-go-results-*
          path: results
          merge-multiple: true
      - run: curl https://install.duckdb.org | sh
      - run: echo "## franz-go compatibility report card" >> "${GITHUB_STEP_SUMMARY}"
      - run: |
          "${DUCKDB_CLI}/duckdb" -markdown -f reports/.github/workflows/scripts/pivot-integration-report.sql >> "${GITHUB_STEP_SUMMARY}"
  cargo-publish-dry-run:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.event_name == 'push' }}
      - run: sudo apt-get update
      - run: sudo apt-get install -y libclang-dev libkrb5-dev
      - run: cargo publish --dry-run --workspace
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
        with:
          config: typos.toml
  third-party-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.event_name == 'push' }}
      - env:
          CARGO_ABOUT_VERSION: 0.8.4
        run: |
          cargo install "cargo-about@$CARGO_ABOUT_VERSION"
          cargo about generate about.hbs >THIRD-PARTY-LICENSE.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: third-party-license
          path: THIRD-PARTY-LICENSE.html
          if-no-files-found: error
  src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          git archive --format=tar.gz HEAD >${{runner.temp}}/src.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: src
          path: ${{runner.temp}}/src.tar.gz
          if-no-files-found: error
  package:
    needs: [test, cargo-publish-dry-run, typos, release]
    runs-on: ${{matrix.os}}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # release's static musl binaries, as dist/linux/<arch>/nisshi.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-*
          merge-multiple: true
          path: dist
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{env.REGISTRY}}/${{github.repository}}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{env.REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  smoke:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        storage:
          - s3://nisshi/
          - postgres://postgres:postgres@db
          - sqlite://nisshi.db
        kafka:
          - apache/kafka:3.9.0
          - apache/kafka:3.8.1
          - apache/kafka:3.7.0
    runs-on: ${{matrix.os}}
    env:
      ADVERTISED_LISTENER_URL: tcp://nisshi:9092
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT: http://minio:9000
      AWS_SECRET_ACCESS_KEY: minioadmin
      CLUSTER_ID: kafka-python-integration
      KAFKA_IMAGE: ${{matrix.kafka}}
      PROMETHEUS_LISTENER_URL: tcp://localhost:9100
      RUST_BACKTRACE: 1
      RUST_LOG: warn,nisshi_broker=debug,nisshi_storage=debug,nisshi_schema=debug
      STORAGE_ENGINE: ${{matrix.storage}}
    steps:
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{env.REGISTRY}}/${{github.repository}}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nisshi-io/example-java
          path: integration
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            etc/initdb.d/010-schema.sql
          sparse-checkout-cone-mode: false
          path: initdb
      - run: ls -lR
      - run: cp -v initdb/etc/initdb.d/010-schema.sql integration/etc/initdb.d
      - run: docker compose --ansi never --progress plain up --no-color --quiet-pull --detach
        working-directory: integration
        env:
          NISSHI_IMAGE: ghcr.io/nisshi-io/nisshi:${{steps.meta.outputs.version}}
      - run: docker compose --ansi never exec minio /usr/bin/mc ready local
        working-directory: integration
        env:
          NISSHI_IMAGE: ghcr.io/nisshi-io/nisshi:${{steps.meta.outputs.version}}
      - run: docker compose --ansi never exec minio /usr/bin/mc alias set local http://localhost:9000 ${{ env.AWS_ACCESS_KEY_ID }} ${{ env.AWS_SECRET_ACCESS_KEY }}
        working-directory: integration
        env:
          NISSHI_IMAGE: ghcr.io/nisshi-io/nisshi:${{steps.meta.outputs.version}}
      - run: docker compose --ansi never exec minio /usr/bin/mc mb local/nisshi
        working-directory: integration
        env:
          NISSHI_IMAGE: ghcr.io/nisshi-io/nisshi:${{steps.meta.outputs.version}}
      - run: sudo apt-get update
      - run: sudo apt-get install -y bats
      - run: docker compose exec db /usr/bin/pg_isready --timeout=60
        working-directory: integration
        env:
          NISSHI_IMAGE: ghcr.io/nisshi-io/nisshi:${{steps.meta.outputs.version}}
      - run: docker compose logs
        working-directory: integration
        env:
          NISSHI_IMAGE: ghcr.io/nisshi-io/nisshi:${{steps.meta.outputs.version}}
      - run: bats --trace --verbose-run tests
        working-directory: integration
        env:
          NISSHI_IMAGE: ghcr.io/nisshi-io/nisshi:${{steps.meta.outputs.version}}
  release:
    needs: [test, src, typos]
    permissions:
      contents: write
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux/arm64
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    env:
      # cc-rs otherwise looks for aarch64-linux-musl-gcc, which Ubuntu doesn't
      # ship, and falls back to glibc gcc for the C deps (aws-lc-sys, ring,
      # libsql-ffi, zstd-sys, ...).
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # The action otherwise sets RUSTFLAGS to "-D warnings".
          rustflags: ""
          # A tag's release build never restores a cache (cache poisoning).
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # rust-cache keys on job + OS + arch, which both macOS legs share.
          cache-key: ${{ matrix.target }}
          cache-save-if: ${{ github.event_name == 'push' }}
      - run: rustc -vV
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - env:
          TARGET: ${{matrix.target}}
        run: rustup target add "$TARGET"
      - if: ${{runner.os == 'Linux'}}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - env:
          TARGET: ${{matrix.target}}
        run: cargo build --release --bin nisshi --all-features --target "$TARGET"
      - if: ${{runner.os == 'Linux'}}
        env:
          TARGET: ${{matrix.target}}
        run: |
          bin=target/"${TARGET}"/release/nisshi
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie|ally) linked' || { echo "::error::$bin is not statically linked"; exit 1; }
      - env:
          TARGET: ${{matrix.target}}
        run: |
          dist=$(mktemp -d -p ${{runner.temp}})
          mkdir "$dist"/bin
          cp target/"${TARGET}"/release/nisshi "$dist"/bin
          cp compose.yaml example.env LICENSE README.md "$dist"
          cp -r etc "$dist"
          tar --create --verbose --gzip --file=nisshi-"${TARGET}".tar.gz -C "$dist" .
      - if: ${{github.ref_type != 'tag'}}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nisshi-${{matrix.target}}
          path: nisshi-${{matrix.target}}.tar.gz
          if-no-files-found: error
      - if: ${{github.ref_type == 'tag'}}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: nisshi-${{matrix.target}}.tar.gz
      # package's Dockerfile copies dist/<platform>/nisshi into the image.
      - if: ${{runner.os == 'Linux'}}
        env:
          PLATFORM: ${{matrix.platform}}
          TARGET: ${{matrix.target}}
        run: |
          mkdir -p dist/"${PLATFORM}"
          cp target/"${TARGET}"/release/nisshi dist/"${PLATFORM}"/nisshi
      - if: ${{runner.os == 'Linux'}}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-${{matrix.target}}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Single stable required-check context for branch protection. Every other
  # job in this workflow is either matrixed (its context name bakes in the
  # matrix values, so it shifts whenever a leg is added/removed/renamed) or,
  # for smoke, intentionally skipped on fork PRs that can't reach the
  # registry. Neither shape survives being named directly in a ruleset's
  # required_status_checks list, so this job fans all of them into one name
  # that does. Each job is listed directly (not relied on transitively
  # through e.g. `test`) so a failure surfaces as `failure` here even when
  # it also cascades a downstream job to `skipped` - `needs.*.result` reads
  # each listed job's own outcome, not the masked one.
  ci-gate:
    if: always()
    needs:
      - check
      - fmt
      - clippy
      - build-storage
      - build-storage-lake
      - test
      - compat-librdkafka
      - compat-franz-go
      - cargo-publish-dry-run
      - typos
      - third-party-license
      - src
      - package
      - smoke
      - release
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
