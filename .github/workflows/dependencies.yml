---
name: Dependencies

# cargo-deny over the full dependency graph: security advisories, license
# compatibility, banned/duplicate crates, and untrusted registries. Installs
# the pinned binary directly rather than `cargo install`, since cargo-deny
# shells out to `cargo metadata` either way and the binary is much faster.
#
# `deny.toml` ignores a fixed, dated list of pre-existing advisories with no
# upstream fix (see its own comment) and downgrades `unmaintained` findings
# to non-blocking; anything else still fails the build.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # `cargo-deny` is a required check; the merge queue tests each entry on a
  # `gh-readonly-queue/...` branch, and without this trigger it'd never
  # report there and every entry would hang.
  merge_group:
    types: [checks_requested]

jobs:
  # Whether a pull_request run needs cargo-deny. Same job as ci.yml's;
  # see the comment there.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          run_all() { echo "$1, running everything"; echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT_NAME" = pull_request ] || run_all "$EVENT_NAME run"
          [ -f .github/scripts/ci-changes.sh ] || run_all "base has no ci-changes.sh"
          bash .github/scripts/ci-changes.test.sh
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/files"
          listed=$(wc -l < "$RUNNER_TEMP/files")
          # The files API stops at 3000; a short list could hide a Rust change.
          [ "$listed" -eq "$CHANGED_FILES" ] || run_all "listed $listed of $CHANGED_FILES changed files"
          bash .github/scripts/ci-changes.sh < "$RUNNER_TEMP/files"
  cargo-deny:
    # Runs unless `changes` said false, so a failed `changes` job can't
    # turn this required check into a passing skip.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      # cargo-deny is not pinned, because it parses the RustSec advisory
      # database, which is not pinned either. An older cargo-deny can fail to
      # parse a newer database format and turn this check red on an unrelated
      # pull request.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny
      - run: cargo-deny --all-features --locked check --warn unmaintained
