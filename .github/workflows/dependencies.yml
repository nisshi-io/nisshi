---
name: Dependencies

# cargo-deny over the full dependency graph: security advisories, license
# compatibility, banned/duplicate crates, and untrusted registries. Installs
# the pinned binary directly rather than `cargo install`, since cargo-deny
# shells out to `cargo metadata` either way and the binary is much faster.
#
# `deny.toml` ignores a fixed, dated list of pre-existing advisories with no
# upstream fix (see its own comment) and downgrades `unmaintained` findings
# to non-blocking; anything else still fails the build.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-deny
      - run: cargo-deny --all-features --locked check --warn unmaintained
