---
name: Workflow lint

# actionlint (correctness) and zizmor (security) over .github/workflows/, so
# a broken or unsafe workflow edit is caught the same way a broken Rust
# change is.
#
# No `paths:` filter: a required check that's path-filtered never reports
# on a PR outside that path and blocks it forever instead of passing it.
# If a heavier job needs this later, gate it behind a `dorny/paths-filter`
# output rather than filtering the trigger.
#
# zizmor is filtered to medium+ severity and confidence - its low-confidence
# heuristics are useful to read but too noisy to gate merges on. The one
# exception is `artipacked`, gated at every threshold by its own step.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Both jobs are required checks; the merge queue tests each entry on a
  # `gh-readonly-queue/...` branch, and without this trigger they'd never
  # report there and every entry would hang.
  merge_group:
    types: [checks_requested]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installed directly (not via a reporting wrapper action) so the job's
      # own exit code is what gates the merge; a wrapper that posts to the
      # Checks API would need `checks: write`, which this workflow doesn't
      # grant and shouldn't need to just run a linter.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: |
          "$(go env GOPATH)/bin/actionlint"
      # The `changes` jobs run the base branch's copy of ci-changes.sh, so a
      # PR's edit to it is only tested here.
      - run: bash .github/scripts/ci-changes.test.sh

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: zizmor@1.30.1
      # GH_TOKEN enables zizmor's online audits (e.g. known-vulnerable-actions,
      # which checks pinned SHAs against GHSA) - the complement to SHA-pinning
      # below: pinning stops tag mutation, this catches a pin that's already
      # bad. contents:read is sufficient; no extra permission needed.
      #
      # The medium/medium thresholds below also hide the open
      # `cache-poisoning` findings. zizmor applies the thresholds globally,
      # so this step cannot show one audit without the other.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-confidence medium --min-severity medium .github/workflows/
      # The thresholds above hide `artipacked` (low confidence), so this step
      # gates that one audit at every threshold. zizmor has no flag to run a
      # single audit, so it reads the JSON report and fails on any unignored
      # `artipacked` finding: each `actions/checkout` must set
      # `persist-credentials: false`, or `true` where a later step needs
      # the token for git. It runs even when the step above fails, so both
      # report.
      - name: zizmor artipacked
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/zizmor.json"
          zizmor --offline --no-exit-codes --strict-collection --format json .github/workflows/ > "$report"
          jq -r '.[] | select(.ident == "artipacked" and (.ignored | not))
            | .locations[0] as $l
            | "::error file=\($l.symbolic.key.Local.verbatim_path),line=\($l.concrete.location.start_point.row + 1)::artipacked: \($l.symbolic.annotation)"' \
            "$report" | tee "$RUNNER_TEMP/artipacked.txt"
          test ! -s "$RUNNER_TEMP/artipacked.txt"
