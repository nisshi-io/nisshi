name: release

# The only workflow a `v*` tag runs. It calls ci.yml for the build and every
# test, then publishes in order: the version tags on the image, the tarballs
# on the GitHub release, then the crates. Each step needs the one before, and
# the first needs `ci` and `on-main`, so a red run publishes nothing. A check
# that must also pass before a release goes in publish-image's `needs`.
#
# The file name stays release.yml: the crates.io trusted publisher is bound
# to it.
permissions:
  contents: read
on:
  push:
    tags:
      - "v*"
# One release run per tag, never cancelled part-way through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    # A called workflow's jobs can't hold more than this job grants, so this
    # lists every permission a ci.yml job declares: `changes` reads the PR
    # files.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  # A tag run uses the workflow at the tagged commit, and the `release`
  # environment checks only that the ref name matches `v*`. This job stops a
  # `v*` tag pushed on a commit that is not on main from publishing. It does
  # not stop someone who can edit the workflow at the tagged commit, because
  # they can remove it; a tag ruleset that restricts who creates `v*` tags is
  # the control for that. It asks the compare API instead of fetching main,
  # so it needs no checkout and works with the read-only token whether the
  # repository is public or private: main is `ahead` of the tagged commit, or
  # `identical` to it, exactly when the commit is on main.
  on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" --jq .status)
          case "$status" in
            ahead|identical) echo "${GITHUB_SHA} is on main (${status})" ;;
            *) echo "::error::${GITHUB_REF} is at ${GITHUB_SHA}, which is not on main (${status}); nothing is published"; exit 1 ;;
          esac

  # The multi-arch image, built from the binaries smoke tested by the same
  # action as tier-c.yml's `edge-publish`, tagged with the version. `latest` comes with the
  # semver tags, for a tag that isn't a prerelease.
  publish-image:
    needs: [ci, on-main]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-image
        with:
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

  # Attaches the tarballs to the GitHub release. It is a job of its own so
  # that `contents: write`, which can create tags the main ruleset doesn't
  # cover, is held by a job that compiles nothing, and the `release`
  # environment's deployment policy (`v*` tags) is a second, server-side check
  # on the ref. The image is pushed first, so a failed upload leaves an image
  # without a release page until this job is re-run.
  github-release:
    needs: [publish-image]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Two hyphens: the tarballs are nisshi-<target>, and docker
          # build-push-action's build record is `nisshi-io~nisshi~<id>.dockerbuild`.
          pattern: nisshi-*-*
          merge-multiple: true
          path: tarballs
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: tarballs/*.tar.gz
          fail_on_unmatched_files: true
          # A semver prerelease (v0.7.0-pre.3) has a hyphen. Marking it keeps
          # it off "Latest", as publish-image keeps it off the `latest` image.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Last, because a crates.io publish can't be undone.
  publish-crates:
    needs: [github-release]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # --no-verify skips cargo's pre-upload build, so no build script runs
      # while this job holds the crates.io token. The verify step is ci.yml's
      # cargo-publish-dry-run, which this run's `ci` job has passed on the
      # tagged commit.
      - run: cargo publish --locked --no-verify --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
