name: Publish to crates.io
on:
  push:
    tags:
      - "v*"
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # --no-verify skips cargo's pre-upload build, so no build script runs
      # while this job holds the crates.io token. The verify step is
      # ci.yml's cargo-publish-dry-run, which runs in the merge queue. This
      # relies on each `v*` tag going on a commit on main, which the main
      # ruleset accepts only through the merge queue.
      - run: cargo publish --locked --no-verify --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
