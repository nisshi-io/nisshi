---
name: tier-c

# Tier C is the optional scheduled tier, run twice a day. It runs the checks
# that are too slow or too unstable to gate a merge: the compat suites on the
# S3 engine, the `test` suite on more Postgres versions, including one beta,
# the build on Windows, and the full macOS release build (ci.yml only checks
# macOS, except on a `v*` tag). It also publishes the `edge` image, see below.
#
# Tier C does not gate anything. It is not in the `needs` of ci-gate and it is
# not a required check. A red run opens or updates one GitHub issue with the
# `nightly-failure` label. The next green run closes that issue.
#
# The `edge-gate` and `edge-publish` jobs push the multi-arch image of main's
# tip as `edge`, and as `main`, which stays for external consumers and goes in
# a follow-up, to each image path that publish-image pushes. They push only
# when the merge queue passed the tip, and they reuse the binaries that the
# push run of ci.yml built, so they compile nothing. `edge` can trail the tip until the next run
# when a merge lands during the scheduled run, or shortly before it while that
# merge's push run is still in progress: the gate then skips the publish.
#
# The workflow runs on main only. Each job checks the ref, so a manual run
# from another ref does nothing.
permissions:
  contents: read
on:
  schedule:
    # 06:17 and 18:17 UTC, which is 02:17 and 14:17 US Eastern while daylight
    # saving time is in effect (01:17 and 13:17 after it ends). Cron has no
    # time zone, so these two times move by an hour at each change. Not on the
    # hour, so the run does not queue with the many scheduled workflows that
    # start at :00.
    - cron: "17 6,18 * * *"
  workflow_dispatch:
# Two Tier C runs on one ref must not overlap: both write to the same issue.
# A run that arrives while another runs waits. GitHub keeps one waiting run
# per group, so a newer run replaces the one that waits. A running job is
# never cancelled. The group includes the ref, so a manual run from another
# ref cannot replace the scheduled run on main.
concurrency:
  group: tier-c-${{ github.ref }}
  cancel-in-progress: false
env:
  CLICOLOR: 1
  # A pinned release and its published checksum for duckdb_cli-linux-amd64.gz,
  # the same pin that ci.yml uses for its report jobs.
  DUCKDB_VERSION: "1.5.6"
  DUCKDB_SHA256: cce2687a38681db644c248198b99ecd86170ff47e324c5f33e50c0042f142839
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A beta image can fail for a reason that is not a defect in nisshi. The
    # beta leg reports its result and does not turn the run red.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: postgres:17
            experimental: false
          - pg: postgres:18
            experimental: false
          # Docker Hub has no tag that follows the latest beta, so a person
          # moves this tag to the next beta, and to the release when it ships.
          - pg: postgres:19beta4
            experimental: true
    env:
      ADVERTISED_LISTENER_URL: tcp://localhost:9092
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ENDPOINT: http://localhost:9000
      AWS_SECRET_ACCESS_KEY: minioadmin
      CLUSTER_ID: nisshi-ci
      DATA_LAKE: s3://lake
      ICEBERG_CATALOG: http://localhost:8181/catalog
      ICEBERG_WAREHOUSE: nisshi
      NEXTEST_PROFILE: ci
      POSTGRES_IMAGE: ${{matrix.pg}}
      PROMETHEUS_LISTENER_URL: tcp://[::]:9100
      SCHEMA_REGISTRY: file://./etc/schema
      STORAGE_ENGINE: s3://nisshi/
      NISSHI_IMAGE: ghcr.io/nisshi-io/nisshi
    steps:
      - run: echo "PG_IMAGE_DASH=${POSTGRES_IMAGE/:/-}" >> "$GITHUB_ENV"
      - run: df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-mirror
        with:
          ecr-fallback-images: ${{matrix.pg}}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - run: just ci
      - run: sudo apt-get update
      - run: sudo apt-get install -y libclang-dev libkrb5-dev
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          # These legs read the cache that the `test` job in ci.yml saves on
          # main. That needs the same shared key, `dev`, and the same values
          # of every `RUST*` and `CARGO*` variable as that job, because the
          # cache key hashes them. A mismatch gives a cold build. This
          # workflow never saves, because a save here would replace the cache
          # that ci.yml restores on every pull request.
          cache-shared-key: dev
          cache-save-if: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.146
      # The test and report steps match ci.yml's `test` job, which explains
      # them.
      #
      # RUST_BACKTRACE and RUST_LOG are set on each step, as in ci.yml: the
      # cache key hashes `RUST*` variables.
      - id: nextest
        run: just test-workspace --timings
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug,nisshi_sans_io=warn,nisshi_model=warn
      - if: ${{ !cancelled() && steps.nextest.outcome != 'skipped' }}
        run: just test-doc
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug,nisshi_sans_io=warn,nisshi_model=warn
      - if: ${{ !cancelled() && steps.nextest.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/test-reports
        with:
          title: Rust tests (${{ matrix.pg }})
          artifact-name: test-reports-${{ env.PG_IMAGE_DASH }}
      - run: df -h
        if: always()
      - run: tar --create --verbose --gzip --file="logs-${PG_IMAGE_DASH}.tar.gz" logs
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-${{env.PG_IMAGE_DASH}}.tar.gz
          path: logs-${{env.PG_IMAGE_DASH}}.tar.gz
          if-no-files-found: error
  compat-librdkafka:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the old version's leg does not open the nightly-failure issue until it
    # has a record in CI
    continue-on-error: ${{ matrix.client.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        # The same client versions as compat-librdkafka in ci.yml.
        client:
          - suffix: ""
          - suffix: -v2.3.0
            version: v2.3.0
            experimental: true
    env:
      ADVERTISED_LISTENER_URL: tcp://localhost:9092
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ENDPOINT: http://localhost:9000
      AWS_SECRET_ACCESS_KEY: minioadmin
      CLUSTER_ID: librdkafka-integration
      LIBRDKAFKA_VERSION: ${{matrix.client.version}}
      POSTGRES_IMAGE: postgres:18
      RESULTS_FILE: results-s3${{matrix.client.suffix}}.csv
      RUST_BACKTRACE: 1
      RUST_LOG: warn
      STORAGE_ENGINE: s3://nisshi/
      STORAGE_FEATURES: dynostore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-mirror
        with:
          ecr-fallback-images: ${{env.POSTGRES_IMAGE}}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - run: sudo apt-get update
      - run: sudo apt-get install -y libclang-dev libkrb5-dev
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - run: just compat-infra-up
      - run: just compat-librdkafka "$STORAGE_ENGINE" "$STORAGE_FEATURES"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-librdkafka-results-s3${{matrix.client.suffix}}
          path: ${{env.RESULTS_FILE}}
          if-no-files-found: warn
  compat-librdkafka-report:
    if: always() && github.ref == 'refs/heads/main'
    needs: [compat-librdkafka]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DUCKDB_CLI: /home/runner/.duckdb/cli/latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/scripts/pivot-integration-report.sql
          sparse-checkout-cone-mode: false
          path: reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compat-librdkafka-results-*
          path: results
          merge-multiple: true
      - name: Install duckdb (pinned version, checksum-verified)
        run: |
          curl -fsSL -o duckdb_cli.gz "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.gz"
          echo "${DUCKDB_SHA256}  duckdb_cli.gz" | sha256sum -c -
          mkdir -p "${DUCKDB_CLI}"
          gunzip -c duckdb_cli.gz >"${DUCKDB_CLI}/duckdb"
          chmod +x "${DUCKDB_CLI}/duckdb"
      - run: echo "## librdkafka compatibility report card (s3)" >> "${GITHUB_STEP_SUMMARY}"
      - run: |
          "${DUCKDB_CLI}/duckdb" -markdown -f reports/.github/workflows/scripts/pivot-integration-report.sql >> "${GITHUB_STEP_SUMMARY}"
  compat-franz-go:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADVERTISED_LISTENER_URL: tcp://localhost:9092
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ENDPOINT: http://localhost:9000
      AWS_SECRET_ACCESS_KEY: minioadmin
      CLUSTER_ID: librdkafka-integration
      POSTGRES_IMAGE: postgres:18
      RESULTS_FILE: results-s3.csv
      RUST_BACKTRACE: 1
      RUST_LOG: warn
      STORAGE_ENGINE: s3://nisshi/
      STORAGE_FEATURES: dynostore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-mirror
        with:
          ecr-fallback-images: ${{env.POSTGRES_IMAGE}}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - run: just compat-infra-up
      - run: just compat-franz-go "$STORAGE_ENGINE" "$STORAGE_FEATURES"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-franz-go-results-s3
          path: ${{env.RESULTS_FILE}}
          if-no-files-found: warn
  compat-franz-go-report:
    if: always() && github.ref == 'refs/heads/main'
    needs: [compat-franz-go]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DUCKDB_CLI: /home/runner/.duckdb/cli/latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/scripts/pivot-integration-report.sql
          sparse-checkout-cone-mode: false
          path: reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compat-franz-go-results-*
          path: results
          merge-multiple: true
      - name: Install duckdb (pinned version, checksum-verified)
        run: |
          curl -fsSL -o duckdb_cli.gz "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.gz"
          echo "${DUCKDB_SHA256}  duckdb_cli.gz" | sha256sum -c -
          mkdir -p "${DUCKDB_CLI}"
          gunzip -c duckdb_cli.gz >"${DUCKDB_CLI}/duckdb"
          chmod +x "${DUCKDB_CLI}/duckdb"
      - run: echo "## franz-go compatibility report card (s3)" >> "${GITHUB_STEP_SUMMARY}"
      - run: |
          "${DUCKDB_CLI}/duckdb" -markdown -f reports/.github/workflows/scripts/pivot-integration-report.sql >> "${GITHUB_STEP_SUMMARY}"
  build-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - run: just build dev
  # The release profile, the linker and cargo-auditable, which the `macos`
  # job in ci.yml skips off a tag. It uploads nothing.
  macos-release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # The same settings as the release build in ci.yml.
          rustflags: ""
          build-warnings: ""
          cache: false
      - run: rustup target add "$TARGET"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-auditable@0.7.6
          fallback: none
      - run: cargo auditable build --release --bin nisshi --all-features --target "$TARGET"
  # Passes only when the tip of main has a successful merge-queue run of
  # ci.yml, so no image is pushed from a commit that skipped the queue. The
  # push run of ci.yml is trimmed and does not test the tree, so the gate
  # reads the merge_group run for the verdict and the push run for the
  # binaries. ci-gate runs under `always()`, so a successful run conclusion
  # means that ci-gate passed.
  edge-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The job reads workflow runs and artifact metadata. It has no checkout.
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      run-id: ${{ steps.gate.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          # A merge can land while this run is in progress. The newer tip gets
          # its image from the next run, and this run must not move `edge`
          # backwards, so it stops without an error.
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at ${tip}, not ${GITHUB_SHA}; the next run publishes the newer tip"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newest run of ci.yml for this commit and event that completed
          # with a success conclusion.
          ok_run() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=$1&per_page=100" \
              --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty'
          }
          queue_run=$(ok_run merge_group)
          if [ -z "$queue_run" ]; then
            echo "::error::${GITHUB_SHA} has no successful merge-queue run of ci.yml, so no image is published"
            exit 1
          fi
          push_run=$(ok_run push)
          # A merge that landed shortly before this run can still have its
          # push run in progress. That is not a failure: the next run
          # publishes the tip.
          running=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ -z "$push_run" ] && [ "$running" -gt 0 ]; then
            echo "::notice::the push run of ci.yml for ${GITHUB_SHA} is still in progress; the next run publishes it"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$push_run" ]; then
            echo "::error::${GITHUB_SHA} has no successful push run of ci.yml, so there are no binaries to publish"
            exit 1
          fi
          # The artifacts expire after 30 days. After 30 days without a merge,
          # the tip's artifacts are gone and an earlier run has already
          # published the tip, so this run stops without an error. Only a new
          # merge produces new artifacts.
          names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${push_run}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")')
          for want in image-x86_64-unknown-linux-musl image-aarch64-unknown-linux-musl; do
            case " ${names} " in
              *" ${want} "*) ;;
              *)
                echo "::notice::run ${push_run} has no unexpired ${want} artifact; edge keeps its current image"
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done
          echo "merge-queue run ${queue_run}, binaries from push run ${push_run}"
          {
            echo "publish=true"
            echo "run_id=${push_run}"
          } >> "$GITHUB_OUTPUT"

  # Pushes the image from the push run's binaries. The gate decides whether it
  # pushes, and the steps skip instead of the job, so a newer tip leaves this
  # job green and `alert` quiet.
  edge-publish:
    needs: [edge-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `actions: read` is for the download of another run's artifacts.
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - if: needs.edge-gate.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `main` is the tag that ci.yml used to push on every merge. It points
      # at the same image as `edge`, and it stays for consumers outside this
      # repository until a follow-up drops it.
      - if: needs.edge-gate.outputs.publish == 'true'
        uses: ./.github/actions/publish-image
        with:
          run-id: ${{ needs.edge-gate.outputs.run-id }}
          tags: |
            type=raw,value=edge
            type=raw,value=main
  alert:
    # This job reads the result of each job above. A beta leg that fails does
    # not change the result of `test`, so it does not raise an alert.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: [test, compat-librdkafka, compat-franz-go, build-windows, macos-release, edge-gate, edge-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The job writes to issues and nothing else. It has no checkout, so
    # `gh` gets the repository from GH_REPO.
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEEDS_JSON: ${{ toJSON(needs) }}
      LABEL: nightly-failure
    steps:
      - name: Open, update, or close the nightly-failure issue
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"${NEEDS_JSON}")"
          open_issue="$(gh issue list --label "${LABEL}" --state open --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "${failed}" ]; then
            gh label create "${LABEL}" --force \
              --color B60205 \
              --description "The nightly Tier C run failed"
            body="The nightly run failed in: $(tr '\n' ' ' <<<"${failed}")"$'\n\n'"Run: ${run_url}"
            if [ -n "${open_issue}" ]; then
              gh issue comment "${open_issue}" --body "${body}"
            else
              gh issue create --label "${LABEL}" \
                --title "Nightly Tier C run failed" \
                --body "${body}"$'\n\n'"This issue closes when a nightly run passes. Later failures add a comment here."
            fi
          elif [ -n "${open_issue}" ]; then
            gh issue close "${open_issue}" --comment "The nightly run passed: ${run_url}"
          fi
