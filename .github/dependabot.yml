version: 2
# Each entry sets `commit-message`, so Dependabot titles its PRs
# `build(deps): bump ...`. pr-title.yml requires a Conventional Commits
# title, and Dependabot's default `Bump ...` title fails it.
#
# Weekly runs land on the weekend, before working hours (Eastern), so the
# CI for a burst of bump PRs does not compete with merge-queue runs during
# the week. Cargo gets its own day because it opens most of the PRs.
#
# Most bumps get their own PR, so one change reverts cleanly. Two kinds of
# bump share a PR instead. Crates that must move to a new version together
# share a group, because a PR that bumps only one of them fails to build.
# Low-risk bumps share one catch-all PR per ecosystem: cargo patch bumps,
# and action minor and patch bumps. A cargo minor bump stays its own PR,
# because Cargo treats a 0.x minor bump as breaking. Dependabot puts a
# dependency in the first group that matches it, so each catch-all group
# comes last.
#
# `open-pull-requests-limit` stays at its default of 5: a low limit would
# let a few long-open major bumps block newer ones. Security updates are
# not subject to the limit, the cooldown or the groups.
updates:
  # The 7-day cooldown gives an upstream CVE or a yanked release time to
  # surface before Dependabot opens a bump PR. A cargo major bump waits 14
  # days, because it is the most likely to be broken or followed by a fix.
  # Dependabot rejects the semver cooldown keys for github-actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "America/Toronto"
    target-branch: "main"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      # The workflows pin init and analyze to the same release.
      codeql:
        patterns: ["github/codeql-action*"]
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/Toronto"
    target-branch: "main"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # Pinned to 1.1.0 in Cargo.toml: buoyant_kernel 0.22.2 depends on
      # "^1", which resolves to 1.2.0 by default, but 1.2.0 renamed the
      # parse_column_name macro to column_name_segments, breaking the
      # version deltalake 0.32.4 actually builds against. Dependabot can't
      # see that constraint and will keep proposing 1.2.x, which fails CI.
      # Drop this once deltalake bumps its buoyant_kernel dependency.
      - dependency-name: "buoyant_kernel_derive"
        versions: [">1.1.0"]
      # rsasl 2.3.1 (the latest release) requires digest 0.10 for its SCRAM
      # key derivation, and sha2 0.11 depends on digest 0.11 instead, so the
      # two cannot both appear as the Sha256/Sha512 types
      # nisshi-storage::alter_user_scram_credentials passes into
      # rsasl::mechanisms::scram::tools::derive_keys. Dependabot cannot see
      # that constraint and will keep proposing 0.11.x, which fails to
      # build. The range starts at 0.11.0, so 0.10 patch releases still
      # arrive. Drop this once rsasl ships a release built against digest
      # 0.11.
      - dependency-name: "sha2"
        versions: [">=0.11.0"]
      # The lake stack moves as one set, and no released set exists past the
      # current one. deltalake 1.x builds against arrow 59, parquet 59 and
      # datafusion 55, but iceberg 0.10.1 and the 0.11.0 release candidates
      # build against arrow 58, parquet 58 and datafusion 54, and arrow 60
      # has no consumer in the stack at all. Dependabot cannot see that, so
      # each arrow-lake PR fails to build. iceberg* stays unignored so its
      # release PRs are the signal; expect the 0.11 one to fail too
      # (datafusion 54 against deltalake 0.32's 53). Drop these four entries
      # once a released iceberg builds against arrow 59 and datafusion 55
      # (main does since apache/iceberg-rust#2958), then move arrow, parquet,
      # datafusion, deltalake and iceberg* in one PR.
      - dependency-name: "arrow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "parquet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "datafusion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "deltalake"
        update-types: ["version-update:semver-major"]
      # pbkdf2 0.13 builds on digest 0.11 through hmac 0.13 and sha2 0.11,
      # and the rsasl constraint above keeps sha2 on 0.10, so nisshi-cli::user
      # and the log_redaction test cannot name one Hmac<Sha256> both accept.
      # Dependabot counts 0.12 -> 0.13 as a minor bump, so this uses a
      # version range like the sha2 entry. The range starts at the first
      # incompatible release, so 0.12 patch releases still arrive. Drop it
      # together with the sha2 entry.
      - dependency-name: "pbkdf2"
        versions: [">=0.13.0"]
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # deltalake, datafusion and the iceberg crates each build against one
      # arrow, parquet and object_store release, so the stack builds only
      # when every crate in it moves to a matching set.
      arrow-lake:
        patterns:
          - "arrow"
          - "datafusion"
          - "deltalake"
          - "iceberg*"
          - "object_store"
          - "parquet"
      # The opentelemetry crates and tracing-opentelemetry share trait
      # types, and each release depends on one matching set of versions.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      protobuf:
        patterns: ["protobuf*"]
      # deadpool-postgres re-exports the deadpool pool type it builds on.
      deadpool:
        patterns: ["deadpool*"]
      # tokio-rustls and tokio-postgres-rustls each build against one rustls
      # release, and the broker and the postgres backend pass rustls config
      # types into them.
      rustls:
        patterns:
          - "rustls*"
          - "tokio-postgres-rustls"
          - "tokio-rustls"
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
  # The Dockerfile's alpine base and .devcontainer's rust base are pinned to
  # exact digests. A digest pin only stays current if something deliberately
  # bumps it, so both get the same Dependabot coverage the other ecosystems
  # above already have, rather than freezing in place indefinitely.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "America/Toronto"
    target-branch: "main"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # The devcontainer's rust tag must stay equal to the channel in
      # rust-toolchain.toml, so Dependabot updates only its digest. A
      # toolchain bump changes both files in one PR.
      - dependency-name: "rust"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    cooldown:
      default-days: 7
  # compose.yaml pins each image by tag and digest. The `docker` ecosystem
  # reads Dockerfiles only, so compose files need their own entry. Dependabot
  # reads the default of a `${VAR:-default}` image, so this entry refreshes the
  # `POSTGRES_IMAGE` digest. It cannot read an image that a variable supplies
  # without a default, so the maintainer bumps these digests by hand: the images
  # in the justfile recipes, and `LAKEKEEPER_IMAGE`. The `LAKEKEEPER_IMAGE`
  # value appears in example.env, ci.yml and tier-c.yml, and the three must match.
  # The `POSTGRES_IMAGE: postgres:18` values in ci.yml (four jobs) and tier-c.yml
  # (two jobs) and the fallback in nisshi-smoke-test/run.sh must keep the major
  # version of the compose default. The mirror action rejects `@sha256`, so they
  # stay unpinned.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "America/Toronto"
    target-branch: "main"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # The compose default stays on the major that README.md documents and the
      # nightly matrix tests. Dependabot refreshes its digest; a person moves
      # the major.
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 7
