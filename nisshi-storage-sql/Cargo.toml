[package]
name = "nisshi-storage-sql"
description = "Nisshi storage backends for PostgreSQL and libSQL (SQLite)"
edition.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
authors.workspace = true
include.workspace = true

[features]
default = ["libsql", "postgres", "turso"]
libsql = ["dep:libsql", "dep:deadpool"]
postgres = ["dep:tokio-postgres", "dep:deadpool", "dep:deadpool-postgres", "dep:tokio-postgres-rustls"]
turso = ["dep:turso", "nisshi-storage/turso"]
test-support = []

# docs.rs builds with nightly, where `branches` 0.4 (a dependency of turso) no longer
# compiles. Remove this table once turso depends on `branches` 0.5.
# https://github.com/nisshi-io/solace-nisshi/issues/1045
[package.metadata.docs.rs]
no-default-features = true
features = ["libsql", "postgres"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
deadpool = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
futures-util.workspace = true
futures.workspace = true
human-units.workspace = true
libsql = { workspace = true, optional = true }
nisshi-sans-io.workspace = true
nisshi-schema.workspace = true
nisshi-storage = {workspace = true, features = ["libsql", "postgres"]}
opentelemetry-semantic-conventions.workspace = true
opentelemetry.workspace = true
rama.workspace = true
rand.workspace = true
regex.workspace = true
rustls-native-certs.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
tokio-util.workspace = true
tokio.workspace = true
tracing.workspace = true
turso = { workspace = true, optional = true }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
glob.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
